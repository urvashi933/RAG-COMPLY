<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RAG.COMPLY - Compliance Assistant</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=Inter:wght@400;500&display=swap');

        :root {
            /* Black and Green Color Palette */
            --bg-main: #050505;          
            --bg-sidebar: #0a0c0a;       
            --bg-panel: #111511;         
            --neon-green: #39ff14;       
            --dark-green: #0e300e;       
            --text-main: #e0e0e0;
            --text-muted: #8a95a5;
            --alert-red: #ff3366; /* Added for Logout hover */
        }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg-main);
            color: var(--text-main);
            font-family: 'Inter', sans-serif;
            height: 100vh;
            display: flex;
            overflow: hidden;
        }

        /* --- Layout --- */
        .app-container {
            display: flex;
            width: 100%;
            height: 100%;
        }

        /* --- Sidebar (Cached Queries) --- */
        .sidebar {
            width: 280px;
            background-color: var(--bg-sidebar);
            border-right: 1px solid var(--dark-green);
            display: flex;
            flex-direction: column;
            padding: 20px;
            box-sizing: border-box;
            z-index: 10;
            box-shadow: 2px 0 15px rgba(57, 255, 20, 0.05);
        }

        .branding {
            display: flex;
            align-items: center;
            font-family: 'Space Grotesk', sans-serif;
            font-size: 1.5rem;
            font-weight: 700;
            margin-bottom: 30px;
            color: white;
            letter-spacing: 1px;
        }

        .branding svg {
            width: 28px;
            height: 28px;
            margin-right: 10px;
            stroke: var(--neon-green);
            filter: drop-shadow(0 0 8px rgba(57, 255, 20, 0.6));
        }

        .branding span { color: var(--neon-green); }

        .sidebar-title {
            font-size: 0.8rem;
            text-transform: uppercase;
            color: var(--text-muted);
            letter-spacing: 1.5px;
            margin-bottom: 15px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .cached-queries {
            display: flex;
            flex-direction: column;
            gap: 10px;
            overflow-y: auto;
        }

        .query-btn {
            background: rgba(57, 255, 20, 0.03);
            border: 1px solid var(--dark-green);
            color: var(--text-main);
            padding: 12px 15px;
            border-radius: 8px;
            text-align: left;
            font-size: 0.9rem;
            font-family: 'Inter', sans-serif;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .query-btn::before { content: '⚡'; font-size: 0.8rem; opacity: 0.5; }
        .query-btn:hover {
            background: rgba(57, 255, 20, 0.1);
            border-color: var(--neon-green);
            box-shadow: 0 0 10px rgba(57, 255, 20, 0.1);
            transform: translateX(4px);
        }

        .cached-queries::-webkit-scrollbar { width: 4px; }
        .cached-queries::-webkit-scrollbar-track { background: transparent; }
        .cached-queries::-webkit-scrollbar-thumb { background: var(--dark-green); border-radius: 10px; }

        /* --- Main Chat Area --- */
        .chat-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            position: relative;
            background: radial-gradient(circle at 50% 0%, rgba(57, 255, 20, 0.03), transparent 60%);
        }

        /* --- Top Header (Logout) --- */
        .chat-header {
            display: flex;
            justify-content: flex-end;
            align-items: center;
            padding: 20px 40px 0 40px;
            z-index: 5;
        }

        .logout-btn {
            display: flex;
            align-items: center;
            gap: 8px;
            background: transparent;
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: var(--text-muted);
            padding: 8px 16px;
            border-radius: 20px;
            font-family: 'Inter', sans-serif;
            font-size: 0.9rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .logout-btn svg {
            width: 16px;
            height: 16px;
            stroke: var(--text-muted);
            transition: all 0.3s ease;
        }

        .logout-btn:hover {
            border-color: var(--alert-red);
            color: var(--alert-red);
            background: rgba(255, 51, 102, 0.05);
            box-shadow: 0 0 15px rgba(255, 51, 102, 0.2);
        }

        .logout-btn:hover svg {
            stroke: var(--alert-red);
        }

        /* --- Chat History --- */
        .chat-history {
            flex: 1;
            overflow-y: auto;
            padding: 20px 40px 40px 40px;
            display: flex;
            flex-direction: column;
            gap: 24px;
        }

        .chat-history::-webkit-scrollbar { width: 6px; }
        .chat-history::-webkit-scrollbar-track { background: transparent; }
        .chat-history::-webkit-scrollbar-thumb { background: rgba(57, 255, 20, 0.2); border-radius: 10px; }

        /* --- Message Bubbles --- */
        .message {
            max-width: 75%;
            padding: 16px 20px;
            border-radius: 12px;
            line-height: 1.6;
            animation: fadeIn 0.3s ease-out forwards;
            opacity: 0;
            transform: translateY(10px);
        }

        .user-message {
            align-self: flex-end;
            background: rgba(57, 255, 20, 0.05);
            border: 1px solid var(--dark-green);
            border-bottom-right-radius: 4px;
        }

        .ai-message {
            align-self: flex-start;
            background: var(--bg-panel);
            border: 1px solid rgba(57, 255, 20, 0.2);
            border-bottom-left-radius: 4px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
        }

        .citation {
            margin-top: 12px;
            padding: 10px 14px;
            background: rgba(0, 0, 0, 0.6);
            border-left: 3px solid var(--neon-green);
            border-radius: 4px;
            font-size: 0.85rem;
            color: var(--text-muted);
            display: flex;
            align-items: center;
            gap: 8px;
            font-family: 'Space Grotesk', sans-serif;
        }

        .citation svg { width: 14px; height: 14px; stroke: var(--neon-green); }

        /* --- Input Area --- */
        .input-wrapper {
            padding: 10px 40px 40px 40px;
            background: linear-gradient(to top, var(--bg-main) 70%, transparent);
        }

        .input-box {
            position: relative;
            max-width: 900px;
            margin: 0 auto;
        }

        .chat-input {
            width: 100%;
            background: var(--bg-panel);
            border: 1px solid var(--dark-green);
            color: white;
            padding: 18px 60px 18px 24px;
            border-radius: 30px;
            font-size: 1rem;
            font-family: 'Inter', sans-serif;
            box-sizing: border-box;
            outline: none;
            transition: all 0.3s ease;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }

        .chat-input:focus {
            border-color: var(--neon-green);
            box-shadow: 0 0 15px rgba(57, 255, 20, 0.15), 0 10px 30px rgba(0,0,0,0.5);
        }

        .send-btn {
            position: absolute;
            right: 8px;
            top: 50%;
            transform: translateY(-50%);
            background: var(--neon-green);
            border: none;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: all 0.2s;
            box-shadow: 0 0 10px rgba(57, 255, 20, 0.4);
        }

        .send-btn:hover { 
            transform: translateY(-50%) scale(1.05); 
            box-shadow: 0 0 20px rgba(57, 255, 20, 0.6);
        }
        .send-btn svg { width: 18px; height: 18px; fill: var(--bg-main); margin-left: 2px; }

        .typing { display: none; align-self: flex-start; padding: 15px 20px; background: var(--bg-panel); border: 1px solid var(--dark-green); border-radius: 12px; border-bottom-left-radius: 4px;}
        .dot { height: 6px; width: 6px; background: var(--neon-green); border-radius: 50%; display: inline-block; animation: blink 1.4s infinite both; margin: 0 2px; }
        .dot:nth-child(2) { animation-delay: 0.2s; }
        .dot:nth-child(3) { animation-delay: 0.4s; }

        @keyframes fadeIn { to { opacity: 1; transform: translateY(0); } }
        @keyframes blink { 0%, 80%, 100% { opacity: 0.2; } 40% { opacity: 1; } }

    </style>
</head>
<body>

    <div class="app-container">
        
        <aside class="sidebar">
            <div class="branding">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M4.5 16.5c-1.5 1.26-2 5-2 5s3.74-.5 5-2c.71-.84.7-2.13-.09-2.91a2.18 2.18 0 0 0-2.91-.09z"/>
                    <path d="m12 15-3-3a22 22 0 0 1 2-3.95A12.88 12.88 0 0 1 22 2c0 2.72-.78 7.5-6 11a22.35 22.35 0 0 1-4 2z"/>
                    <path d="M9 12H4s.55-3.03 2-4c1.62-1.08 5 0 5 0"/>
                    <path d="M12 15v5s3.03-.55 4-2c1.08-1.62 0-5 0-5"/>
                </svg>
                RAG<span>.COMPLY</span>
            </div>

            <div class="sidebar-title">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><polyline points="12 6 12 12 16 14"></polyline></svg>
                Cached Queries
            </div>

            <div class="cached-queries">
                <button class="query-btn" onclick="sendCachedQuery('How do I register my startup with DPIIT?')">DPIIT Registration Steps</button>
                <button class="query-btn" onclick="sendCachedQuery('What are the conditions for the 80-IAC Angel Tax exemption?')">Angel Tax Exemption (80-IAC)</button>
                <button class="query-btn" onclick="sendCachedQuery('Do startups need to file GST if revenue is under 20 Lakhs?')">GST Thresholds</button>
                <button class="query-btn" onclick="sendCachedQuery('What are the compliances under the Shops and Establishments Act?')">Shops & Establishments Act</button>
                <button class="query-btn" onclick="sendCachedQuery('What are the penalties for late filing of AOC-4?')">AOC-4 Late Filing Penalties</button>
            </div>
        </aside>

        <main class="chat-area">
            
            <header class="chat-header">
                <button class="logout-btn" onclick="handleLogout()">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
                        <polyline points="16 17 21 12 16 7"></polyline>
                        <line x1="21" y1="12" x2="9" y2="12"></line>
                    </svg>
                    Logout
                </button>
            </header>

            <div class="chat-history" id="chat-history">
                <div class="message ai-message">
                    <strong>System Initialized.</strong><br><br>I am the RAG.COMPLY assistant. I navigate Indian startup compliance, GST, and MCA regulations using only verified government data. 
                    <br><br>Type a question below, or select a cached query from the sidebar to begin.
                </div>
            </div>

            <div class="typing" id="typing-indicator">
                <span class="dot"></span><span class="dot"></span><span class="dot"></span>
            </div>

            <div class="input-wrapper">
                <div class="input-box">
                    <input type="text" id="user-input" class="chat-input" placeholder="Ask about startup compliance..." autocomplete="off" onkeypress="handleKeyPress(event)">
                    <button class="send-btn" onclick="sendMessage()">
                        <svg viewBox="0 0 24 24"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>
                    </button>
                </div>
            </div>
        </main>

    </div>

    <script>
        const chatHistory = document.getElementById('chat-history');
        const userInput = document.getElementById('user-input');
        const typingIndicator = document.getElementById('typing-indicator');

        function handleKeyPress(event) {
            if (event.key === 'Enter') {
                sendMessage();
            }
        }

        function sendCachedQuery(queryText) {
            userInput.value = queryText;
            sendMessage();
        }

        // Flask Logout Redirect Function
        function handleLogout() {
            // Replace '/logout' with whatever your Flask logout route is named
            window.location.href = '/logout';
        }

        async function sendMessage() {
            const messageText = userInput.value.trim();
            if (!messageText) return;

            // 1. Display User Message
            appendMessage(messageText, 'user');
            userInput.value = '';

            // 2. Show Typing Indicator & Scroll
            typingIndicator.style.display = 'block';
            chatHistory.appendChild(typingIndicator);
            scrollToBottom();

            // 3. SEND TO FLASK BACKEND
            try {
                // --- MOCK RESPONSE FOR FRONTEND DEMO ---
                setTimeout(() => {
                    typingIndicator.style.display = 'none';
                    const mockAnswer = "According to retrieved context, startups recognized by DPIIT are exempt from Angel Tax under Section 56(2)(viib) of the Income Tax Act, provided their paid-up capital does not exceed ₹25 Crores after the proposed issue of shares.";
                    const mockSource = "Notification No. G.S.R. 127(E), DPIIT Gazette, MCA Guidelines";
                    appendMessage(mockAnswer, 'ai', mockSource);
                }, 1200);
                // ---------------------------------------
            } catch (error) {
                typingIndicator.style.display = 'none';
                appendMessage("System Error: Could not connect to the compliance vector database.", 'ai');
            }
        }

        function appendMessage(text, sender, source = null) {
            const msgDiv = document.createElement('div');
            msgDiv.classList.add('message', `${sender}-message`);
            msgDiv.innerHTML = text; 

            if (sender === 'ai' && source) {
                const citationDiv = document.createElement('div');
                citationDiv.classList.add('citation');
                citationDiv.innerHTML = `
                    <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
                        <polyline points="14 2 14 8 20 8"></polyline>
                        <line x1="16" y1="13" x2="8" y2="13"></line>
                        <line x1="16" y1="17" x2="8" y2="17"></line>
                        <polyline points="10 9 9 9 8 9"></polyline>
                    </svg>
                    VERIFIED SOURCE: ${source}
                `;
                msgDiv.appendChild(citationDiv);
            }

            chatHistory.appendChild(msgDiv);
            scrollToBottom();
        }

        function scrollToBottom() {
            chatHistory.scrollTop = chatHistory.scrollHeight;
        }
    </script>
</body>
</html>
