<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RAG.COMPLY - Compliance Assistant</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=Inter:wght@400;500&display=swap');

        :root {
            /* Black and Green Color Palette */
            --bg-main: #050505;          
            --bg-sidebar: #0a0c0a;       
            --bg-panel: #111511;         
            --neon-green: #39ff14;       
            --dark-green: #0e300e;       
            --text-main: #e0e0e0;
            --text-muted: #8a95a5;
            --alert-red: #ff3366; 
        }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg-main);
            color: var(--text-main);
            font-family: 'Inter', sans-serif;
            height: 100vh;
            display: flex;
            overflow: hidden;
        }

        /* --- Layout --- */
        .app-container {
            display: flex;
            width: 100%;
            height: 100%;
        }

        /* --- Sidebar --- */
        .sidebar {
            width: 300px;
            background-color: var(--bg-sidebar);
            border-right: 1px solid var(--dark-green);
            display: flex;
            flex-direction: column;
            padding: 20px;
            box-sizing: border-box;
            z-index: 10;
            box-shadow: 2px 0 15px rgba(57, 255, 20, 0.05);
        }

        .branding {
            display: flex;
            align-items: center;
            font-family: 'Space Grotesk', sans-serif;
            font-size: 1.5rem;
            font-weight: 700;
            margin-bottom: 30px;
            color: white;
            letter-spacing: 1px;
        }

        .branding svg {
            width: 28px;
            height: 28px;
            margin-right: 10px;
            stroke: var(--neon-green);
            filter: drop-shadow(0 0 8px rgba(57, 255, 20, 0.6));
        }
        .branding span { color: var(--neon-green); }

        .sidebar-title {
            font-size: 0.75rem;
            text-transform: uppercase;
            color: var(--text-muted);
            letter-spacing: 1.5px;
            margin-bottom: 15px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .sidebar-section {
            display: flex;
            flex-direction: column;
            margin-bottom: 25px;
        }
        
        .history-section {
            flex: 1;
            overflow: hidden; 
        }

        /* Lists in Sidebar */
        .scrollable-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
            overflow-y: auto;
            max-height: 250px;
        }

        .history-list { max-height: 100%; }

        /* Sidebar Buttons */
        .query-btn, .history-item {
            background: rgba(57, 255, 20, 0.03);
            border: 1px solid var(--dark-green);
            color: var(--text-main);
            padding: 10px 14px;
            border-radius: 8px;
            text-align: left;
            font-size: 0.85rem;
            font-family: 'Inter', sans-serif;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            gap: 10px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .query-btn::before { content: '⚡'; font-size: 0.8rem; opacity: 0.5; }
        .history-item::before { content: '🕒'; font-size: 0.8rem; opacity: 0.5; }
        
        .history-item { background: transparent; border-color: rgba(255,255,255,0.05); }

        .query-btn:hover, .history-item:hover {
            background: rgba(57, 255, 20, 0.1);
            border-color: var(--neon-green);
            transform: translateX(4px);
        }

        /* Custom Scrollbars */
        .scrollable-list::-webkit-scrollbar { width: 4px; }
        .scrollable-list::-webkit-scrollbar-track { background: transparent; }
        .scrollable-list::-webkit-scrollbar-thumb { background: var(--dark-green); border-radius: 10px; }

        /* --- Main Chat Area --- */
        .chat-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            position: relative;
            background: radial-gradient(circle at 50% 0%, rgba(57, 255, 20, 0.03), transparent 60%);
        }

        /* --- Top Header (Logout) --- */
        .chat-header {
            display: flex;
            justify-content: flex-end;
            align-items: center;
            padding: 20px 40px 0 40px;
            z-index: 5;
        }

        .logout-btn {
            display: flex;
            align-items: center;
            gap: 8px;
            background: transparent;
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: var(--text-muted);
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 0.85rem;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        .logout-btn:hover { border-color: var(--alert-red); color: var(--alert-red); }
        .logout-btn svg { width: 16px; height: 16px; stroke: currentColor; }

        /* --- Chat History Window --- */
        .chat-history {
            flex: 1;
            overflow-y: auto;
            padding: 20px 40px 40px 40px;
            display: flex;
            flex-direction: column;
            gap: 24px;
        }
        .chat-history::-webkit-scrollbar { width: 6px; }
        .chat-history::-webkit-scrollbar-thumb { background: rgba(57, 255, 20, 0.2); border-radius: 10px; }

        /* --- Message Bubbles --- */
        .message {
            max-width: 80%;
            padding: 16px 20px;
            border-radius: 12px;
            line-height: 1.6;
            animation: fadeIn 0.3s ease-out forwards;
        }

        .user-message {
            align-self: flex-end;
            background: rgba(57, 255, 20, 0.05);
            border: 1px solid var(--dark-green);
            border-bottom-right-radius: 4px;
        }

        .ai-message {
            align-self: flex-start;
            background: var(--bg-panel);
            border: 1px solid rgba(57, 255, 20, 0.2);
            border-bottom-left-radius: 4px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
        }

        /* Sector Badge inside User Message */
        .sector-badge {
            display: inline-block;
            font-size: 0.65rem;
            text-transform: uppercase;
            font-family: 'Space Grotesk', sans-serif;
            background: rgba(57, 255, 20, 0.1);
            color: var(--neon-green);
            padding: 3px 8px;
            border-radius: 12px;
            margin-right: 8px;
            border: 1px solid rgba(57, 255, 20, 0.3);
            vertical-align: middle;
            margin-bottom: 2px;
        }

        .citation {
            margin-top: 12px;
            padding: 10px 14px;
            background: rgba(0, 0, 0, 0.6);
            border-left: 3px solid var(--neon-green);
            border-radius: 4px;
            font-size: 0.85rem;
            color: var(--text-muted);
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .citation svg { width: 14px; height: 14px; stroke: var(--neon-green); }

        /* --- Input Area --- */
        .input-wrapper {
            padding: 10px 40px 40px 40px;
            background: linear-gradient(to top, var(--bg-main) 70%, transparent);
        }

        .input-box {
            display: flex;
            align-items: center;
            gap: 10px;
            max-width: 900px;
            margin: 0 auto;
        }

        /* Dropdown for Sector */
        .sector-select {
            background: var(--bg-panel);
            color: var(--text-muted);
            border: 1px solid var(--dark-green);
            padding: 18px 15px;
            border-radius: 30px;
            font-family: 'Inter', sans-serif;
            font-size: 0.9rem;
            outline: none;
            cursor: pointer;
            transition: all 0.3s;
        }
        .sector-select:focus { border-color: var(--neon-green); color: white; }

        .chat-input-container {
            position: relative;
            flex: 1;
        }

        .chat-input {
            width: 100%;
            background: var(--bg-panel);
            border: 1px solid var(--dark-green);
            color: white;
            padding: 18px 60px 18px 24px;
            border-radius: 30px;
            font-size: 1rem;
            font-family: 'Inter', sans-serif;
            box-sizing: border-box;
            outline: none;
            transition: all 0.3s ease;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }

        .chat-input:focus { border-color: var(--neon-green); box-shadow: 0 0 15px rgba(57, 255, 20, 0.15); }

        .send-btn {
            position: absolute;
            right: 8px;
            top: 50%;
            transform: translateY(-50%);
            background: var(--neon-green);
            border: none;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: all 0.2s;
        }
        .send-btn:hover { transform: translateY(-50%) scale(1.05); box-shadow: 0 0 15px rgba(57, 255, 20, 0.6); }
        .send-btn svg { width: 18px; height: 18px; fill: var(--bg-main); margin-left: 2px; }

        .typing { display: none; align-self: flex-start; padding: 15px 20px; background: var(--bg-panel); border: 1px solid var(--dark-green); border-radius: 12px; border-bottom-left-radius: 4px;}
        .dot { height: 6px; width: 6px; background: var(--neon-green); border-radius: 50%; display: inline-block; animation: blink 1.4s infinite both; margin: 0 2px; }
        .dot:nth-child(2) { animation-delay: 0.2s; }
        .dot:nth-child(3) { animation-delay: 0.4s; }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes blink { 0%, 80%, 100% { opacity: 0.2; } 40% { opacity: 1; } }

    </style>
</head>
<body>

    <div class="app-container">
        
        <aside class="sidebar">
            <div class="branding">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M4.5 16.5c-1.5 1.26-2 5-2 5s3.74-.5 5-2c.71-.84.7-2.13-.09-2.91a2.18 2.18 0 0 0-2.91-.09z"/>
                    <path d="m12 15-3-3a22 22 0 0 1 2-3.95A12.88 12.88 0 0 1 22 2c0 2.72-.78 7.5-6 11a22.35 22.35 0 0 1-4 2z"/>
                    <path d="M9 12H4s.55-3.03 2-4c1.62-1.08 5 0 5 0"/>
                    <path d="M12 15v5s3.03-.55 4-2c1.08-1.62 0-5 0-5"/>
                </svg>
                RAG<span>.COMPLY</span>
            </div>

            <div class="sidebar-section">
                <div class="sidebar-title">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="13 2 13 9 20 9"></polyline><path d="M13 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"></path></svg>
                    Quick Prompts
                </div>
                <div class="scrollable-list">
                    <button class="query-btn" onclick="sendCachedQuery('How do I register my startup with DPIIT?')">DPIIT Registration</button>
                    <button class="query-btn" onclick="sendCachedQuery('What are the conditions for Angel Tax exemption?')">Angel Tax Exemption</button>
                    <button class="query-btn" onclick="sendCachedQuery('Do startups need to file GST if revenue is under 20 Lakhs?')">GST Thresholds</button>
                </div>
            </div>

            <div class="sidebar-section history-section">
                <div class="sidebar-title">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"></circle><polyline points="12 6 12 12 16 14"></polyline></svg>
                    Session History
                </div>
                <div class="scrollable-list history-list" id="sidebar-history">
                    <div style="font-size: 0.8rem; color: var(--dark-green); padding: 10px;">History is empty.</div>
                </div>
            </div>
        </aside>

        <main class="chat-area">
            <header class="chat-header">
                <button class="logout-btn" onclick="handleLogout()">
                    <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
                        <polyline points="16 17 21 12 16 7"></polyline>
                        <line x1="21" y1="12" x2="9" y2="12"></line>
                    </svg>
                    Logout
                </button>
            </header>

            <div class="chat-history" id="chat-history">
                <div class="message ai-message">
                    <strong>System Initialized.</strong><br><br>I am the RAG.COMPLY assistant. Select your sector below and ask a question to get verified compliance guidance.
                </div>
            </div>

            <div class="typing" id="typing-indicator">
                <span class="dot"></span><span class="dot"></span><span class="dot"></span>
            </div>

            <div class="input-wrapper">
                <div class="input-box">
                    
                    <select id="sector-select" class="sector-select">
                        <option value="Legal">Legal</option>
                        <option value="Workforce">Workforce</option>
                    </select>

                    <div class="chat-input-container">
                        <input type="text" id="user-input" class="chat-input" placeholder="Ask about startup compliance..." autocomplete="off" onkeypress="handleKeyPress(event)">
                        <button class="send-btn" onclick="sendMessage()">
                            <svg viewBox="0 0 24 24"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>
                        </button>
                    </div>

                </div>
            </div>
        </main>
    </div>

    <script>
        const chatHistory = document.getElementById('chat-history');
        const userInput = document.getElementById('user-input');
        const sectorSelect = document.getElementById('sector-select');
        const typingIndicator = document.getElementById('typing-indicator');
        const sidebarHistory = document.getElementById('sidebar-history');
        
        let queryCount = 0; // Tracks history

        function handleKeyPress(event) {
            if (event.key === 'Enter') sendMessage();
        }

        function sendCachedQuery(queryText) {
            userInput.value = queryText;
            sendMessage();
        }

        function handleLogout() {
            window.location.href = '/logout';
        }

        function addToHistorySidebar(queryText) {
            if (queryCount === 0) sidebarHistory.innerHTML = ''; // Clear "empty" message
            
            const historyItem = document.createElement('div');
            historyItem.classList.add('history-item');
            historyItem.innerText = queryText;
            // Clicking history item puts it back in the input box
            historyItem.onclick = () => { userInput.value = queryText; };
            
            // Add to top of list
            sidebarHistory.prepend(historyItem);
            queryCount++;
        }

        async function sendMessage() {
            const messageText = userInput.value.trim();
            const selectedSector = sectorSelect.value;
            if (!messageText) return;

            // 1. Display User Message (with Sector)
            appendMessage(messageText, 'user', null, selectedSector);
            
            // 2. Add to Sidebar History
            addToHistorySidebar(messageText);

            userInput.value = '';

            // 3. Show Typing Indicator
            typingIndicator.style.display = 'block';
            chatHistory.appendChild(typingIndicator);
            scrollToBottom();

            // 4. API CALL TO FLASK (Simulated here)
            try {
                // Mock Delay
                setTimeout(() => {
                    typingIndicator.style.display = 'none';
                    const mockAnswer = `As a startup focusing on <b>${selectedSector}</b> compliance, you must ensure adherence to the respective statutory requirements and guidelines mapped in our database. Startups recognized by DPIIT are eligible for several regulatory exemptions.`;
                    const mockSource = "DPIIT Gazette, Section 56(2)(viib)";
                    appendMessage(mockAnswer, 'ai', mockSource, null);
                }, 1200);
            } catch (error) {
                typingIndicator.style.display = 'none';
                appendMessage("System Error: Could not connect to vector database.", 'ai');
            }
        }

        function appendMessage(text, sender, source = null, sector = null) {
            const msgDiv = document.createElement('div');
            msgDiv.classList.add('message', `${sender}-message`);
            
            let messageHTML = '';

            // If user message, prepend the Sector Badge
            if (sender === 'user' && sector) {
                messageHTML += `<span class="sector-badge">${sector}</span> `;
            }
            
            messageHTML += text; 
            msgDiv.innerHTML = messageHTML;

            // AI Citation Box
            if (sender === 'ai' && source) {
                const citationDiv = document.createElement('div');
                citationDiv.classList.add('citation');
                citationDiv.innerHTML = `
                    <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
                        <polyline points="14 2 14 8 20 8"></polyline><line x1="16" y1="13" x2="8" y2="13"></line><line x1="16" y1="17" x2="8" y2="17"></line>
                    </svg>
                    VERIFIED SOURCE: ${source}
                `;
                msgDiv.appendChild(citationDiv);
            }

            chatHistory.appendChild(msgDiv);
            scrollToBottom();
        }

        function scrollToBottom() {
            chatHistory.scrollTop = chatHistory.scrollHeight;
        }
    </script>
</body>
</html>
