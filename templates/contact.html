<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contact | RAG.COMPLY</title>

<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;500;700;800&family=Space+Mono&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

<style>

/* ===== ROOT (SAME AS ABOUT US) ===== */
:root {
    --bg-dark: #050505;
    --primary-neon: #10b981;
    --accent-glow: rgba(16, 185, 129, 0.4);
    --glass: rgba(255, 255, 255, 0.03);
    --glass-border: rgba(16, 185, 129, 0.2);
    --text-main: #f8fafc;
    --text-muted: #94a3b8;
}

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: 'Plus Jakarta Sans', sans-serif;
}

/* ===== BODY ===== */
body {
    background-color: var(--bg-dark);
    color: var(--text-main);

    background-image:
        linear-gradient(rgba(16,185,129,0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(16,185,129,0.03) 1px, transparent 1px);
    background-size: 40px 40px;
}

/* ===== NAVBAR (MATCHED) ===== */
nav {
    position: fixed;
    top: 0;
    width: 100%;
    padding: 1.2rem 8%;
    display: flex;
    justify-content: space-between;
    align-items: center;
    background: rgba(5,5,5,0.85);
    backdrop-filter: blur(20px);
    border-bottom: 1px solid var(--glass-border);
    z-index: 1000;
}

.logo {
    font-weight: 800;
    font-size: 1.5rem;
    color: var(--primary-neon);
    text-decoration: none;
}

.nav-center {
    display: flex;
    gap: 3rem;
}

.nav-links {
    text-decoration: none;
    color: var(--text-main);
    font-size: 0.9rem;
    font-weight: 500;
}

.nav-links:hover,
.nav-links.active {
    color: var(--primary-neon);
    text-shadow: 0 0 10px var(--accent-glow);
}

.nav-right {
    display: flex;
    gap: 1rem;
}

/* BUTTONS */
.btn {
    padding: 0.8rem 1.6rem;
    border-radius: 0.7rem;
    font-weight: 700;
    transition: 0.3s;
    text-decoration: none;
}

.btn-primary {
    background: var(--primary-neon);
    color: black;
}

.btn-outline {
    border: 1px solid var(--primary-neon);
    color: var(--primary-neon);
}

.btn:hover {
    transform: scale(1.05);
    box-shadow: 0 0 20px var(--accent-glow);
}

/* ===== MAIN SECTION ===== */
.section {
    padding: 150px 8% 80px;
    max-width: 1400px;
    margin: auto;
}

/* GRID */
.container {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 4rem;
}

/* LEFT SIDE */
.left h1 {
    font-size: 3rem;
    font-weight: 800;
    margin-bottom: 1rem;
}

.left p {
    color: var(--text-muted);
    margin-bottom: 2rem;
}

/* INFO CARDS */
.card {
    background: var(--glass);
    border: 1px solid var(--glass-border);
    padding: 1.5rem;
    border-radius: 1rem;
    margin-bottom: 1rem;
    backdrop-filter: blur(10px);
    transition: 0.3s;
}

.card:hover {
    border-color: var(--primary-neon);
    box-shadow: 0 0 20px var(--accent-glow);
}

/* RIGHT FORM */
.right {
    background: var(--glass);
    border: 1px solid var(--glass-border);
    padding: 2rem;
    border-radius: 1.5rem;
    backdrop-filter: blur(12px);
}

/* INPUTS */
input, textarea {
    width: 100%;
    padding: 1rem;
    margin-bottom: 1rem;
    border-radius: 0.7rem;
    border: 1px solid var(--glass-border);
    background: rgba(0,0,0,0.5);
    color: white;
    outline: none;
    transition: 0.3s;
}

input:focus, textarea:focus {
    border-color: var(--primary-neon);
    box-shadow: 0 0 10px var(--accent-glow);
}

textarea {
    height: 130px;
}

/* BUTTON */
button {
    width: 100%;
    padding: 1rem;
    border-radius: 0.7rem;
    border: none;
    background: var(--primary-neon);
    color: black;
    font-weight: 700;
    cursor: pointer;
}

button:hover {
    box-shadow: 0 0 20px var(--accent-glow);
}

/* SUCCESS */
.success {
    margin-top: 1rem;
    color: var(--primary-neon);
    display: none;
}

/* FOOTER */
footer {
    padding: 60px 8%;
    border-top: 1px solid var(--glass-border);
    display: flex;
    justify-content: space-between;
}

/* RESPONSIVE */
@media(max-width: 900px) {
    .container {
        grid-template-columns: 1fr;
    }

    .nav-center {
        display: none;
    }
}

</style>
</head>

<body>

<!-- NAV -->
<nav>
    <a href="/" class="logo">RAG.COMPLY</a>

    <div class="nav-center">
        <a href="/" class="nav-links">Home</a>
        <a href="/#features" class="nav-links">Features</a>
        <a href="/#workflow" class="nav-links">Workflow</a>
        <a href="/aboutUs" class="nav-links">About Us</a>
        <a href="/contact" class="nav-links active">Contact</a>
    </div>

    <div class="nav-right">
        <a href="/login" class="btn btn-outline">Login</a>
        <a href="/assistant" class="btn btn-primary">Get Started</a>
    </div>
</nav>

<!-- MAIN -->
<section class="section">
    <div class="container">

        <!-- LEFT -->
        <div class="left">
            <h1>Get in Touch</h1>
            <p>Have compliance questions or need guidance? Our AI + team is ready.</p>

            <div class="card">📧 Email<br><small>your@email.com</small></div>
            <div class="card">📞 Phone<br><small>+91 XXXXX XXXXX</small></div>
            <div class="card">📍 Location<br><small>India</small></div>
        </div>

        <!-- RIGHT -->
        <div class="right">
            <form id="contactForm">
                <input type="text" placeholder="Name" required>
                <input type="email" placeholder="Email" required>
                <textarea placeholder="Message"></textarea>

                <button type="submit">Send Message</button>
                <div class="success">Message sent successfully 🚀</div>
            </form>
        </div>

    </div>
</section>

<!-- FOOTER -->
<footer>
    <div class="logo">RAG.COMPLY</div>
    <p style="color: var(--text-muted); font-size: 0.8rem;">
        © 2026 AI Governance Labs
    </p>
</footer>

<script>
document.getElementById("contactForm").addEventListener("submit", function(e){
    e.preventDefault();
    document.querySelector(".success").style.display = "block";
});
</script>

</body>
</html>
